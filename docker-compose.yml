services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-assistant-postgres
    environment:
      POSTGRES_DB: ai_assistant
      POSTGRES_USER: ai_assistant
      POSTGRES_PASSWORD: ai_assistant
    ports:
      - "127.0.0.1:56000:5432"
    volumes:
      - ai_assistant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_assistant -d ai_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ai_assistant_postgres_data:
